name: Diagnose Ubuntu system certificate
on:
  push:
    branches: [diagnose-034-local-tls]
permissions:
  contents: read
jobs:
  system-certifi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect system Python and certificate location
        shell: bash
        run: |
          python3 -c "import sys,certifi; print('SYSTEM_PYTHON',sys.executable); print('CERTIFI_MODULE',certifi.__file__); print('CERTIFI_CA',certifi.where())"
      - name: Reproduce source-only Linux check
        shell: bash
        run: |
          python3 -B -X utf8 tests/check-deepseek-api.py windows/app /tmp/phyrex-system-certifi-report.json
