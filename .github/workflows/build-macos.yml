name: Build and verify Windows and Mac beta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mac/**'
      - 'windows/**'
      - 'tests/**'
      - 'release/**'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

concurrency:
  group: public-beta-build
  cancel-in-progress: false

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and verify native Mac package, including extracted runtime
        run: python3 mac/build.py --arch '${{ matrix.arch }}' --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-mac-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*checks.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify public base runtime, build and check extracted Windows package
        run: python windows/build.py --output dist-windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows
          path: |
            dist-windows/*-Compact.7z
            dist-windows/*-Update.zip
            dist-windows/*.sha256
            dist-windows/*checks.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check the read-aloud code shipped for each platform
        run: |
          node --check windows/app/web/app.js
          node --check mac/app/web/app.js
          node tests/latency-ui.cjs windows/app/web/app.js
          node tests/latency-ui.cjs mac/app/web/app.js
          node tests/live-updates-ui.cjs windows/app/web/app.js
          node tests/live-updates-ui.cjs mac/app/web/app.js
          node tests/read-aloud.cjs windows/app/web/app.js dist-updates/Windows-read-aloud-checks.json
          node tests/read-aloud.cjs mac/app/web/app.js dist-updates/Mac-read-aloud-checks.json
          python3 -B tests/check-fed-phrasing.py windows/app dist-updates/Windows-fed-phrasing-checks.json
          python3 -B tests/check-fed-phrasing.py mac/app dist-updates/Mac-fed-phrasing-checks.json
          python3 -B tests/check-claude-api.py windows/app dist-updates/Windows-claude-api-checks.json
          python3 -B tests/check-claude-api.py mac/app dist-updates/Mac-claude-api-checks.json
          python3 release/build_latency_update.py dist-updates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-updates
          path: dist-updates/*
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [mac, windows, updates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: artifacts
      - name: Publish a new tested prerelease without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Keep job artifacts separate until duplicate names have been rejected.
          packages=(
            Fed-English-Translator-0.3.3-beta-Windows-x64-Compact.7z
            Fed-English-Translator-0.3.3-beta-macOS-arm64.zip
            Fed-English-Translator-0.3.3-beta-macOS-x86_64.zip
            PhyrexNi-0.3.3-Windows-Mac-App-Update.zip
            PhyrexNi-AI-0.3.3-Windows-x64-Update.zip
            PhyrexNi-AI-0.3.3-macOS-arm64-Update.zip
            PhyrexNi-AI-0.3.3-macOS-x86_64-Update.zip
          )
          reports=()
          for stem in Fed-English-Translator-0.3.3-beta-Windows-x64-Compact Fed-English-Translator-0.3.3-beta-macOS-arm64 Fed-English-Translator-0.3.3-beta-macOS-x86_64; do
            for suffix in checks latency-checks provider-checks read-aloud-checks relocated-checks fed-phrasing-checks claude-api-checks; do
              reports+=("$stem-$suffix.json")
            done
          done
          for platform in Windows-x64 macOS-arm64 macOS-x86_64; do
            reports+=("PhyrexNi-AI-0.3.3-$platform-Update-checks.json")
          done
          reports+=(PhyrexNi-0.3.3-Windows-Mac-App-Update-checks.json)
          for platform in Windows Mac; do
            for suffix in read-aloud-checks fed-phrasing-checks claude-api-checks; do
              reports+=("$platform-$suffix.json")
            done
          done
          declare -A expected=()
          for name in "${packages[@]}" "${reports[@]}"; do expected["$name"]=1; done
          for name in "${packages[@]}"; do expected["$name.sha256"]=1; done
          [[ ${#packages[@]} -eq 7 && ${#reports[@]} -eq 31 && ${#expected[@]} -eq 45 ]]
          mkdir staged-assets
          for artifact in release-windows release-mac-arm64 release-mac-x86_64 release-updates; do
            dir="artifacts/$artifact"
            [[ -d "$dir" && ! -L "$dir" ]]
            while IFS= read -r -d '' entry; do
              [[ -f "$entry" && ! -L "$entry" ]] || { echo "Unexpected artifact entry: $entry"; exit 1; }
              name="${entry##*/}"
              [[ -n "${expected[$name]+present}" && ! -e "staged-assets/$name" ]] || { echo "Unexpected or duplicate asset: $name"; exit 1; }
              cp -- "$entry" "staged-assets/$name"
            done < <(find "$dir" -mindepth 1 -maxdepth 1 -print0)
          done
          [[ $(find artifacts -mindepth 1 -maxdepth 1 | wc -l) -eq 4 ]]
          verify_assets() {
            local dir="$1" name digest
            local -a lines
            [[ $(find "$dir" -mindepth 1 -maxdepth 1 | wc -l) -eq ${#expected[@]} ]]
            for name in "${!expected[@]}"; do [[ -f "$dir/$name" && ! -L "$dir/$name" ]] || { echo "Missing asset: $name"; return 1; }; done
            for name in "${packages[@]}"; do
              mapfile -t lines < <(tr -d '\r' < "$dir/$name.sha256")
              [[ ${#lines[@]} -eq 1 && "${lines[0]}" =~ ^([0-9a-f]{64})[[:space:]][[:space:]](.+)$ && "${BASH_REMATCH[2]}" == "$name" ]] || { echo "Invalid checksum file: $name.sha256"; return 1; }
              digest="${BASH_REMATCH[1]}"
              [[ "$(sha256sum -- "$dir/$name" | cut -d ' ' -f1)" == "$digest" ]] || { echo "Checksum mismatch: $name"; return 1; }
              echo "SHA-256 OK: $name"
            done
          }
          verify_assets staged-assets
          tag=v0.3.3-beta
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title '@PhyrexNi · Claude API 公开测试版 0.3.3' --notes-file release/RELEASE.md
          gh release upload "$tag" staged-assets/*
          mkdir verify-downloads
          gh release download "$tag" --dir verify-downloads
          verify_assets verify-downloads
          for report in "${reports[@]}"; do
            cmp "staged-assets/$report" "verify-downloads/$report"
          done
          for name in "${packages[@]}"; do cmp "staged-assets/$name.sha256" "verify-downloads/$name.sha256"; done
          gh release edit "$tag" --draft=false --prerelease
