name: Build and verify Windows and Mac beta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mac/**'
      - 'windows/**'
      - 'tests/**'
      - 'release/**'
      - '.github/workflows/build-macos.yml'

permissions:
  contents: read

concurrency:
  group: public-beta-build
  cancel-in-progress: false

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and verify native Mac package, including extracted runtime
        run: python3 mac/build.py --arch '${{ matrix.arch }}' --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-mac-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*checks.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify public base runtime, build and check extracted Windows package
        run: python windows/build.py --output dist-windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-windows
          path: |
            dist-windows/*-Compact.7z
            dist-windows/*.sha256
            dist-windows/*checks.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check the read-aloud code shipped for each platform
        run: |
          node --check windows/app/web/app.js
          node --check mac/app/web/app.js
          node tests/read-aloud.cjs windows/app/web/app.js dist-updates/Windows-read-aloud-checks.json
          node tests/read-aloud.cjs mac/app/web/app.js dist-updates/Mac-read-aloud-checks.json
          python3 release/build_updates.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-updates
          path: dist-updates/*
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [mac, windows, updates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish a new tested prerelease without overwriting existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c *.sha256
          tag=v0.2.5-beta
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite it.'
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title '@PhyrexNi · 中文朗读公开测试版 0.2.5' --notes-file ../release/RELEASE.md
          gh release upload "$tag" ./*.7z ./*.zip ./*.sha256 ./*checks.json
          gh release edit "$tag" --draft=false --prerelease
